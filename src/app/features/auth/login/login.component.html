<div class="auth-container">
  <div class="auth-card-wrapper">
    <div class="brand-header">
      <div class="logo-icon">
        <mat-icon>task_alt</mat-icon>
      </div>
      <h1>TaskFlow Pro</h1>
      <p>Sign in to your workspace account</p>
    </div>

    <mat-card class="auth-card">
      <mat-card-content class="!p-6 sm:!p-8">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
          
          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" placeholder="e.g. john" autocomplete="username">
            <mat-icon matPrefix color="primary" class="mr-2">person</mat-icon>
            <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
              Username is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-full">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="••••••••" autocomplete="current-password">
            <mat-icon matPrefix color="primary" class="mr-2">lock</mat-icon>
            <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
              <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>

          <button 
            mat-flat-button 
            color="primary" 
            type="submit" 
            class="submit-btn py-3 text-base font-semibold transition-all shadow-md hover:shadow-lg mt-2"
            [disabled]="loginForm.invalid || isLoading">
            <div class="flex items-center justify-center gap-2">
              <mat-spinner *ngIf="isLoading" diameter="20" color="accent"></mat-spinner>
              <span>{{ isLoading ? 'Signing in...' : 'Sign In' }}</span>
            </div>
          </button>

        </form>

        <div class="mt-6 pt-6 border-t border-slate-200 text-center text-sm text-slate-600">
          Don't have an account? 
          <a routerLink="/signup" class="text-indigo-600 font-semibold hover:underline">Create Account</a>
        </div>

        <div class="demo-box mt-6 p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs text-slate-600">
          <span class="font-semibold text-slate-700 block mb-1">💡 Demo Accounts:</span>
          <div class="flex justify-between">
            <span>Username: <code class="bg-slate-200 px-1 rounded">john</code></span>
            <span>Password: <code class="bg-slate-200 px-1 rounded">123456</code></span>
          </div>
        </div>

      </mat-card-content>
    </mat-card>
  </div>
</div>
